<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>All Results List</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#667; --head:#1e5bd8; --line:#dde; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --fg:#eee; --muted:#9aa; --head:#6aa0ff; --line:#2a2f38; }
  }
  body { margin:0; padding:16px; max-width:640px; margin-inline:auto; background:var(--bg); color:var(--fg);
         font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color:var(--head); }
  h1 { font-size:1.4rem; margin:0 0 2px; }
  h2 { font-size:1.1rem; margin:0; }
  .meta { color:var(--muted); font-size:.85rem; margin-bottom:14px; }
  section { border-top:1px solid var(--line); padding:12px 0; }
  .standings { font-size:.9rem; margin:2px 0 6px; }
  ul { list-style:none; margin:6px 0 0; padding:0 0 0 14px; }
  li { padding:3px 0; display:flex; gap:10px; align-items:baseline; }
  .date { color:var(--muted); font-size:.85rem; min-width:5.2em; font-variant-numeric:tabular-nums; }
  .tag { color:var(--muted); font-size:.75rem; border:1px solid var(--line); border-radius:4px; padding:0 4px; }
  .none { color:var(--muted); font-size:.9rem; padding-left:14px; }
  #err { color:#c00; }
  .live { color:var(--muted); font-size:.8rem; margin:0 0 8px; display:flex; gap:10px; align-items:center; }
  .live button { font:inherit; padding:1px 10px; border:1px solid var(--muted); border-radius:6px;
                 background:transparent; color:var(--fg); }
  .foot { color:var(--muted); font-size:.75rem; margin-top:16px; }
</style>
</head>
<body>
<h1 id="title">All Results List</h1>
<div class="meta" id="meta"></div>
<div class="live"><button id="refresh" type="button">Refresh</button><span id="stamp"></span></div>
<div id="list"></div>
<p id="err"></p>
<div class="foot">Scoring by ezRegatta, a Broadreach Services Application</div>

<script>
// EDIT: address of the results service (the Cloudflare Worker) followed by /d, no trailing slash
const DATA_BASE = 'https://ezregatta-results.ezregatta.workers.dev/d';

const slug = new URLSearchParams(location.search).get('o') || '';
const SLUG_OK = /^[a-f0-9]{16,64}$/;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dmy = d => new Date(d).toLocaleDateString(undefined, { day:'2-digit', month:'2-digit', year:'2-digit' });

const POLL_MS = 30000;      // how often an open page checks for changes (paused while the tab is hidden)
let last = '', busy = false;
// Polling that backs off when nothing changes, so tabs left open all day stay cheap: the base interval for
// 2 minutes after the last change, then every 30 s, then every 60 s; polling stops after 2 hours without a change
// (Refresh or returning to the tab resumes it). Hidden tabs never poll.
let lastChange = Date.now(), timer, stopped = false;
function nextDelay() {
  const idle = Date.now() - lastChange;
  return idle < 120000 ? POLL_MS : idle < 600000 ? Math.max(POLL_MS, 30000) : Math.max(POLL_MS, 60000);
}
function schedule() {
  clearTimeout(timer);
  if (stopped) return;
  if (Date.now() - lastChange > 7200000) {
    document.getElementById('stamp').textContent = 'Paused to save data. Tap Refresh to resume.';
    return;
  }
  timer = setTimeout(async () => { if (!document.hidden) await load(); schedule(); }, nextDelay());
}
function wake() { lastChange = Date.now(); schedule(); }      // someone is here: reset the back-off


async function load() {
  if (busy) return;
  busy = true;
  const err = document.getElementById('err'), stamp = document.getElementById('stamp');
  stamp.textContent = 'Checking…';
  try {
    const res = await fetch(`${DATA_BASE}/owners/${slug}.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) { const e = new Error('Results list not found. Check the link, or nothing may be published yet.'); e.fatal = true; throw e; }
    const txt = await res.text();
    if (txt !== last) { last = txt; lastChange = Date.now(); render(JSON.parse(txt)); }      // redraw only when something changed
    err.textContent = '';
    stamp.textContent = 'Checked ' + new Date().toLocaleTimeString();
  } catch (e) {
    if (!last || e.fatal) err.textContent = e.message;
    else stamp.textContent = 'Connection problem, retrying…';
  } finally { busy = false; }
}

if (!SLUG_OK.test(slug)) document.getElementById('err').textContent = 'No results list specified. Use the link from the organiser.';
else {
  document.getElementById('refresh').onclick = () => { wake(); load(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { wake(); load(); } });
  schedule();
  load();
}

const regattaItem = r => SLUG_OK.test(r.slug || '')
  ? `<li><span class="date">${dmy(r.date)}</span><a href="regatta.html?r=${encodeURIComponent(r.slug)}">${esc(r.name)}</a>` +
    `${r.isFinal ? '<span class="tag">final</span>' : ''}</li>`
  : '';

function render(d) {
  document.title = 'All Results List';
  document.getElementById('meta').textContent = `Updated ${new Date(d.updated).toLocaleString()}`;

  let h = '';
  for (const s of d.series || []) {
    const standings = SLUG_OK.test(s.slug || '')
      ? `<div class="standings"><a href="series.html?s=${encodeURIComponent(s.slug)}">Series standings</a></div>` : '';
    const items = (s.regattas || []).map(regattaItem).join('');
    h += `<section><h2>${esc(s.name)}</h2>${standings}` +
         (items ? `<ul>${items}</ul>` : '<div class="none">No regattas published yet.</div>') + '</section>';
  }
  const other = (d.other || []).map(regattaItem).join('');
  if (other) h += `<section><h2>Other regattas</h2><ul>${other}</ul></section>`;
  if (!h) h = '<section><div class="none">Nothing is published yet.</div></section>';
  document.getElementById('list').innerHTML = h;
}
</script>
</body>
</html>
