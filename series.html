<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Series Standings</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#667; --head:#1e5bd8; --seed:#2a9d4a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --fg:#eee; --muted:#9aa; --head:#2f6fe8; --seed:#2a9d4a; }
  }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color:var(--head); }
  th a { color:#fff; }
  h1 { font-size:1.4rem; margin:0 0 2px; }
  .back { font-size:.85rem; margin:0 0 6px; }
  .meta { color:var(--muted); font-size:.85rem; margin-bottom:10px; }
  .legend { font-size:.8rem; margin:0 0 10px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .legend span { padding:1px 6px; }
  .wrap { overflow-x:auto; }
  table { border-collapse:separate; border-spacing:2px; white-space:nowrap; }
  th { background:var(--head); color:#fff; font-weight:600; padding:3px 8px; }
  th.seed { background:var(--seed); }
  th small { display:block; font-weight:normal; font-size:.7rem; }
  th .w { color:#8df0a8; }
  td { padding:3px 8px; text-align:center; }
  td.name { text-align:right; }
  td.net { font-weight:700; }
  td.score sup { font-size:.6rem; margin-left:2px; opacity:.85; }
  .out { outline:2px solid var(--fg); outline-offset:-2px; }
  .sh-red { background:#ff3b30; color:#fff; }
  .sh-r2 { background:rgba(255,59,48,.2); }
  .sh-r5 { background:rgba(255,59,48,.5); }
  .sh-g  { background:rgba(52,199,89,.3); }
  #err { color:#c00; }
  .live { color:var(--muted); font-size:.8rem; margin:0 0 8px; display:flex; gap:10px; align-items:center; }
  .live button { font:inherit; padding:1px 10px; border:1px solid var(--muted); border-radius:6px;
                 background:transparent; color:var(--fg); }
  .foot { color:var(--muted); font-size:.75rem; margin-top:16px; }
</style>
</head>
<body>
<div class="back" id="back"></div>
<h1 id="title">Loading…</h1>
<div class="meta" id="meta"></div>
<div class="live"><button id="refresh" type="button">Refresh</button><span id="stamp"></span></div>
<div class="legend">
  <span class="out">Discard</span><span class="sh-r2">DNx</span><span class="sh-r5">DSQ, DNE</span><span class="sh-g">RDG</span>
</div>
<div class="wrap"><table id="tbl"></table></div>
<p id="err"></p>
<div class="foot">Scoring by ezRegatta, a Broadreach Services Application</div>

<script>
// EDIT: address of the results service (the Cloudflare Worker) followed by /d, no trailing slash
const DATA_BASE = 'https://YOUR-WORKER.workers.dev/d';

const slug = new URLSearchParams(location.search).get('s') || '';
const SLUG_OK = /^[a-f0-9]{16,64}$/;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => String(Math.round(Number(n) * 10) / 10);
const dmy = d => new Date(d).toLocaleDateString(undefined, { day:'2-digit', month:'2-digit', year:'2-digit' });
const SHADE = { NotScored:'sh-red', RET:'sh-r2', DNC:'sh-r2', DNF:'sh-r2', DNS:'sh-r2', OCS:'sh-r2', ZFP:'sh-r2',
  SCP:'sh-r2', NSC:'sh-r2', DPI:'sh-r2', DNE:'sh-r5', DSQ:'sh-r5', BFD:'sh-r5', UFD:'sh-r5', DGM:'sh-r5',
  WDN:'sh-r5', RDG:'sh-g', RDGm:'sh-g' };

const POLL_MS = 15000;      // how often an open page checks for new standings (paused while the tab is hidden)
let last = '', busy = false;
// Polling that backs off when nothing changes, so tabs left open all day stay cheap: the base interval for
// 2 minutes after the last change, then every 30 s, then every 60 s; polling stops after 2 hours without a change
// (Refresh or returning to the tab resumes it). Hidden tabs never poll.
let lastChange = Date.now(), timer, stopped = false;
function nextDelay() {
  const idle = Date.now() - lastChange;
  return idle < 120000 ? POLL_MS : idle < 600000 ? Math.max(POLL_MS, 30000) : Math.max(POLL_MS, 60000);
}
function schedule() {
  clearTimeout(timer);
  if (stopped) return;
  if (Date.now() - lastChange > 7200000) {
    document.getElementById('stamp').textContent = 'Paused to save data. Tap Refresh to resume.';
    return;
  }
  timer = setTimeout(async () => { if (!document.hidden) await load(); schedule(); }, nextDelay());
}
function wake() { lastChange = Date.now(); schedule(); }      // someone is here: reset the back-off


async function load() {
  if (busy) return;
  busy = true;
  const err = document.getElementById('err'), stamp = document.getElementById('stamp');
  stamp.textContent = 'Checking…';
  try {
    const res = await fetch(`${DATA_BASE}/series/${slug}.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) { const e = new Error('Standings not found. Check the link, or they may not be published yet.'); e.fatal = true; throw e; }
    const txt = await res.text();
    if (txt !== last) { last = txt; lastChange = Date.now(); render(JSON.parse(txt)); }      // redraw only when something changed
    err.textContent = '';
    stamp.textContent = 'Checked ' + new Date().toLocaleTimeString();
  } catch (e) {
    if (!last || e.fatal) err.textContent = e.message;
    else stamp.textContent = 'Connection problem, retrying…';
  } finally { busy = false; }
}

if (!SLUG_OK.test(slug)) document.getElementById('err').textContent = 'No series specified. Use the link from the organiser.';
else {
  document.getElementById('refresh').onclick = () => { wake(); load(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { wake(); load(); } });
  schedule();
  load();
}

const regLink = h => SLUG_OK.test(h.regattaSlug || '')
  ? `<a href="regatta.html?r=${encodeURIComponent(h.regattaSlug)}">${esc(h.regatta)}</a>` : esc(h.regatta);

function render(d) {
  const back = document.getElementById('back');
  back.innerHTML = SLUG_OK.test(d.ownerSlug || '')
    ? `<a href="owner.html?o=${encodeURIComponent(d.ownerSlug)}">&larr; All Results List</a>` : '';
  document.title = d.name + ' – Standings';
  document.getElementById('title').textContent = d.name;
  document.getElementById('meta').textContent =
    `${d.scoring} · ${d.scoreBy} · ${d.note} · Updated ${new Date(d.updated).toLocaleString()}`;

  const fixed = ['Place', 'Name', d.netLabel, 'Gross', 'Sailed', 'DNC'];
  let h = '<thead>';
  if (d.byRegatta) {
    h += '<tr>' + fixed.map(x => `<th>${esc(x)}</th>`).join('') +
      d.heads.map(x => `<th>${dmy(x.date)}<small>${regLink(x)}</small>` +
        `${x.weight != null ? `<small class="w">${Number(x.weight).toFixed(1)}</small>` : ''}</th>`).join('') + '</tr>';
  } else {
    // row 1: regatta (date + name) spanning its races; row 2: race labels, seed races green
    const groups = [];
    for (const x of d.heads) {
      const last = groups[groups.length - 1];
      if (last && last.regatta === x.regatta && last.date === x.date) last.n++;
      else groups.push({ regatta: x.regatta, date: x.date, head: x, n: 1 });
    }
    h += '<tr>' + fixed.map(x => `<th rowspan="2">${esc(x)}</th>`).join('') +
      groups.map(g => `<th colspan="${Number(g.n)}">${dmy(g.date)}<small>${regLink(g.head)}</small></th>`).join('') + '</tr>';
    h += '<tr>' + d.heads.map(x => `<th class="${x.isSeed ? 'seed' : ''}">${esc(x.label)}</th>`).join('') + '</tr>';
  }
  h += '</thead><tbody>';

  for (const r of d.rows) {
    h += `<tr><td>${esc(r.rank)}</td><td class="name">${esc(r.name)}</td><td class="net">${num(r.net)}</td><td>${num(r.gross)}</td>` +
         `<td class="${r.belowMinimum ? 'sh-r2 out' : ''}">${esc(r.sailed)}</td><td>${esc(r.dnc)}</td>`;
    for (const c of r.cells) {
      if (!c) { h += '<td>-</td>'; continue; }
      const cls = ['score', SHADE[c.code] || '', c.thrownOut ? 'out' : ''].join(' ');
      h += `<td class="${cls}">${num(c.score)}${c.code ? `<sup>${esc(c.code)}</sup>` : ''}</td>`;
    }
    h += '</tr>';
  }
  document.getElementById('tbl').innerHTML = h + '</tbody>';
}
</script>
</body>
</html>
